name: Go lint
on:
  push:
    branches:
      - main
      - release-*
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/golangci-lint.yaml
      - schemas/**
      - internal/jsonschema/**
  pull_request:
    branches:
      - main
      - release-*
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/golangci-lint.yaml
      - schemas/**
      - internal/jsonschema/**

permissions:
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Go modules cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            %LocalAppData%\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Check go.mod/go.sum to be consistent
        run: go mod tidy -v && git diff --exit-code

      - name: Check schemas to be consistent
        run: make schemas && git diff --exit-code

      - name: Test schema validation
        run: go test ./...
        working-directory: internal/jsonschema

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11.4
          skip-cache: true
          only-new-issues: true
          args: --verbose
